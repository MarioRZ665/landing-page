version: '3.8'

services:
  web:
    image: node:16-alpine
    container_name: next-landing-vpn
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    command: sh -c "yarn install && yarn dev"
